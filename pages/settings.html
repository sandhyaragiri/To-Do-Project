<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="./CSS/settings.css">
    <script src="./CSS/JAVASCRIPT/settings.js" defer></script>
</head>
<body>
   <div class="settings">
    <h2>⚙️ Settings</h2>
</div>

<section class="settings-card">
    <h2>🔤 Font Theme</h2>

    <div class="setting-option">
        <label for="fontTheme">Choose Font</label>

        <select id="fontTheme">
            <option value="poppins">Poppins</option>
            <option value="roboto">Roboto</option>
            <option value="inter">Inter</option>
            <option value="montserrat">Montserrat</option>
            <option value="lato">Lato</option>
            <option value="openSans">Open Sans</option>
            <option value="nunito">Nunito</option>
        </select>
    </div>
</section>

    <section class="settings-card streak-card">
    <h2>🔥 Productivity Streak</h2>

    <div class="streak-stats">
        <div class="stat-box">
            <h3 id="currentStreak">0</h3>
            <p>Current Days</p>
        </div>

        <div class="stat-box">
            <h3 id="bestStreak">0</h3>
            <p>Best Days</p>
        </div>

        <div class="stat-box">
            <h3 id="lastCompleted">--</h3>
            <p>Last Completed</p>
        </div>
</section>
</div>
</body>
</html>
