<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="./CSS/settings.css">
    <script src="./CSS/JAVASCRIPT/settings.js" defer></script>
</head>
<body>

<div class="settings">
    <h2>⚙️ Settings</h2>
</div>

<section id="font-theme">
  <select id="fontSelector">
   
   <option value="" disabled selected>Font-Styles</option>
   <option value="Inter">Inter</option>
   <option value="Poppins">Poppins</option>
   <option value="Roboto">Roboto</option>
   <option value="Montserrat">Montserrat</option>
   <option value="Outfit">Outfit</option>
   <option value="Nunito">Nunito</option>
   <option value="DM Sans">DM Sans</option>
   <option value="Manrope">Manrope</option>
</select>
</section>

<section id="accent-color">
 <select name="accentcolor" id="accentSelector">
   <option value="" disabled selected>Accent-Color</option>
<option value="#C4B5FD">Purple</option>
<option value="#FCA5A5">Red</option>
<option value="#93C5FD">Blue</option>
<option value="#86EFAC">Green</option>
 </select>
</section>


</body>
</html>
