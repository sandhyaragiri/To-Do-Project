<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

    <link rel="stylesheet" href="./CSS/sharedtheme.css">
    <link rel="stylesheet" href="./CSS/settings.css">

     <script src="./CSS/JAVASCRIPT/theme.js" defer></script>
    <script src="./CSS/JAVASCRIPT/settings.js" defer></script>
</head>
<body>

<div class="settings">
    <h2>⚙️ Settings</h2>
</div>

<div class="allsections">
<section id="font-theme">

  <select name="fontfamily" id="fontSelector">
   
   <option value="" disabled selected>Font-family</option>
   <option value="Trebuchet MS">Trebuchet MS</option>
   <option value="Georgia">Georgia</option>
   <option value="Courier New">Courier New</option>
  </select>
</section>

<section id="accent-color">

<select name="accentcolor" id="accentSelector">
<option value="" disabled selected>Accent-Color</option>
<option value="#C4B5FD">Purple</option>
<option value="#FCA5A5">Red</option>
<option value="#93C5FD">Blue</option>
<option value="#86EFAC">Green</option>
 </select>
</section>

 <div class="setting-item">
    <div>
      <h3>Show Completed Tasks</h3>
      <p>Keep completed tasks visible in your list.</p>
    </div>
    <button id="completedToggle">✓</button>
  </div>

  <div class="setting-item">
    <div>
      <h3>Notifications</h3>
      <p>Receive reminders for your tasks.</p>
    </div>
    <button id="notificationToggle">🔔</button>
  </div>

</div>
</body>
</html>
