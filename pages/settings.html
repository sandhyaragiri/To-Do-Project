<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="./CSS/settings.css">
    <script src="./CSS/JAVASCRIPT/settings.js" defer></script>
</head>
<body>
   <div class="settings">
    <h2>⚙️ Settings</h2>
</div>

<div class="settings-modal hidden">
    <label>Font Size</label>
    <select>
        <option>Small</option>
        <option>Medium</option>
        <option>Large</option>
    </select>

    <section class="settings-card streak-card">
    <h2>🔥 Productivity Streak</h2>

    <div class="streak-stats">
        <div class="stat-box">
            <h3 id="currentStreak">0</h3>
            <p>Current Days</p>
        </div>

        <div class="stat-box">
            <h3 id="bestStreak">0</h3>
            <p>Best Days</p>
        </div>

        <div class="stat-box">
            <h3 id="lastCompleted">--</h3>
            <p>Last Completed</p>
        </div>
    </div>
</section>
</div>
</body>
</html>
